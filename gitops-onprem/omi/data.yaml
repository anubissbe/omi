# Datalaag voor de omi-stack: Redis, Qdrant (vector DB ter vervanging van Pinecone),
# Typesense (search). StatefulSets met longhorn PVCs (default storageclass onprem).
# Secrets (wachtwoorden/API-keys) komen uit Secret omi-data (zie secrets.md).
---
apiVersion: v1
kind: Secret
metadata: {name: omi-data, namespace: omi}
# Waarden uit secrets.md; leeg in git — Argo CD sync faalt zonder deze Secret,
# maak hem vóór de eerste sync aan (zie README).
stringData:
  REDIS_PASSWORD: "REPLACE_ME"
  TYPESENSE_API_KEY: "REPLACE_ME"
  QDRANT_API_KEY: "REPLACE_ME"
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: omi-redis, namespace: omi, labels: {app.kubernetes.io/name: omi-redis}}
spec:
  serviceName: omi-redis
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: omi-redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: omi-redis}}
    spec:
      imagePullSecrets: [{name: gitlab-registry}]
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: omi-data, key: REDIS_PASSWORD}}
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {exec: {command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {requests: {memory: 128Mi, cpu: 100m}, limits: {memory: 512Mi, cpu: 500m}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: omi-redis-data}
---
apiVersion: v1
kind: Service
metadata: {name: omi-redis, namespace: omi, labels: {app.kubernetes.io/name: omi-redis}}
spec:
  selector: {app.kubernetes.io/name: omi-redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: omi-redis-data, namespace: omi}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: omi-qdrant, namespace: omi, labels: {app.kubernetes.io/name: omi-qdrant}}
spec:
  serviceName: omi-qdrant
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: omi-qdrant}}
  template:
    metadata: {labels: {app.kubernetes.io/name: omi-qdrant}}
    spec:
      imagePullSecrets: [{name: gitlab-registry}]
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.0
          env:
            - {name: QDRANT__SERVICE__API_KEY, valueFrom: {secretKeyRef: {name: omi-data, key: QDRANT_API_KEY}}}
          ports:
            - {name: http, containerPort: 6333}
            - {name: grpc, containerPort: 6334}
          readinessProbe: {httpGet: {path: /readyz, port: 6333}, initialDelaySeconds: 10, periodSeconds: 5}
          resources: {requests: {memory: 512Mi, cpu: 250m}, limits: {memory: 2Gi, cpu: 1000m}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /qdrant/storage}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: omi-qdrant-data}
---
apiVersion: v1
kind: Service
metadata: {name: omi-qdrant, namespace: omi, labels: {app.kubernetes.io/name: omi-qdrant}}
spec:
  selector: {app.kubernetes.io/name: omi-qdrant}
  ports:
    - {name: http, port: 6333, targetPort: 6333}
    - {name: grpc, port: 6334, targetPort: 6334}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: omi-qdrant-data, namespace: omi}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: omi-typesense, namespace: omi, labels: {app.kubernetes.io/name: omi-typesense}}
spec:
  serviceName: omi-typesense
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: omi-typesense}}
  template:
    metadata: {labels: {app.kubernetes.io/name: omi-typesense}}
    spec:
      imagePullSecrets: [{name: gitlab-registry}]
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: typesense
          image: typesense/typesense:27.1
          args: ["--data-dir", "/data", "--api-key", "$(TYPESENSE_API_KEY)", "--enable-cors"]
          env:
            - name: TYPESENSE_API_KEY
              valueFrom: {secretKeyRef: {name: omi-data, key: TYPESENSE_API_KEY}}
          ports: [{name: http, containerPort: 8108}]
          readinessProbe: {httpGet: {path: /health, port: 8108}, initialDelaySeconds: 10, periodSeconds: 5}
          resources: {requests: {memory: 256Mi, cpu: 100m}, limits: {memory: 1Gi, cpu: 500m}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: omi-typesense-data}
---
apiVersion: v1
kind: Service
metadata: {name: omi-typesense, namespace: omi, labels: {app.kubernetes.io/name: omi-typesense}}
spec:
  selector: {app.kubernetes.io/name: omi-typesense}
  ports: [{name: http, port: 8108, targetPort: 8108}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: omi-typesense-data, namespace: omi}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
# Netwerk: alleen pods in namespace omi en ingress-nginx (kube-system) mogen de
# datalaag en de app bereiken — zelfde patroon als chatioo-app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: omi-app, namespace: omi}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
---
# ── Postgres job store (vervangt de Firestore emulator voor de batch job
#    store, workstream A). CNPG Cluster (zelfde operator als chatioo-db/tip-db);
#    het app-Secret omi-db-app (gegenereerd door CNPG) levert de DSN als
#    JOBSTORE_PG_DSN. Schema-migraties: initContainer draait
#    `python -m database.jobstore migrate` uit de backend-image tegen de DSN.
#    De primaire customer-data store blijft Firestore-emulator (zie verderop);
#    deze Postgres is de A1/A2 jobstore + outbox.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: omi-db, namespace: omi}
spec:
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c7747d8d1049fff9cf30d9cd83d14d609c957afb5ffbcd114145f393ea1850e1
  bootstrap:
    initdb: {database: omi, owner: omi}
  storage: {storageClass: longhorn, size: 20Gi}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
---
# ── Firebase emulator-suite ALLEEN voor Auth (9099): Firestore zit nu in
#    Postgres (jobstore), Auth kan niet zonder emulator op onprem (geen ADC).
#    Geen Firestore meer hier -> geen export/import loop, geen PVC nodig.
apiVersion: apps/v1
kind: Deployment
metadata: {name: omi-firebase-emulator, namespace: omi, labels: {app.kubernetes.io/name: omi-firebase-emulator}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: omi-firebase-emulator}}
  template:
    metadata: {labels: {app.kubernetes.io/name: omi-firebase-emulator}}
    spec:
      imagePullSecrets: [{name: gitlab-registry}]
      securityContext: {seccompProfile: {type: RuntimeDefault}, runAsNonRoot: true, runAsUser: 1000}
      terminationGracePeriodSeconds: 30
      containers:
        - name: emulator
          image: andreysenov/firebase-tools:13.35.1
          command: ["sh", "-c", "printf '{\"emulators\":{\"auth\":{\"host\":\"0.0.0.0\",\"port\":9099},\"ui\":{\"host\":\"0.0.0.0\",\"port\":4000},\"hub\":{\"host\":\"0.0.0.0\",\"port\":4400}}} ' > /tmp/firebase.json && exec firebase emulators:start --config /tmp/firebase.json --only auth --project demo-omi-local"]
          env:
            - {name: FIREBASE_TOKEN, value: ""}  # emulator-only, geen login nodig
            - {name: FIREBASE_CLI_NO_UPDATE_NOTIFIER, value: "true"}
            - {name: XDG_CONFIG_HOME, value: "/tmp/config"}
            - {name: XDG_CACHE_HOME, value: "/tmp/cache"}
          ports:
            - {name: auth, containerPort: 9099}
            - {name: ui, containerPort: 4000}
          readinessProbe: {tcpSocket: {port: 9099}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: 9099}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {memory: 256Mi, cpu: 100m}, limits: {memory: 1Gi, cpu: 500m}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: home, mountPath: /home/node}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: omi-firebase-emulator, namespace: omi, labels: {app.kubernetes.io/name: omi-firebase-emulator}}
spec:
  selector: {app.kubernetes.io/name: omi-firebase-emulator}
  ports:
    - {name: auth, port: 9099, targetPort: 9099}
    - {name: ui, port: 4000, targetPort: 4000}
---
# ── Init-job voor het jobstore-schema: draait de in-tree migraties
#    (database/jobstore/migrations/*.sql) tegen omi-db. Idempotent (advisory
#    lock + schema_migrations checksums). Gebruikt de backend-image zodat de
#    migratiecode exact bij de draaiende versie hoort.
apiVersion: batch/v1
kind: Job
metadata: {name: omi-jobstore-migrate, namespace: omi, labels: {app.kubernetes.io/name: omi-jobstore-migrate}}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: gitlab-registry}]
      securityContext: {seccompProfile: {type: RuntimeDefault}, runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: migrate
          image: git.euraika.net:5050/euraika/omi/backend:b9a510f7
          command: ["python", "-c",
            "import os, psycopg; from database.jobstore.migrate import migrate, current_version; dsn=os.environ['JOBSTORE_PG_DSN']; conn=psycopg.connect(dsn, autocommit=True); print('applied', migrate(conn)); print('schema version', current_version(conn)); conn.close()"]
          env:
            - {name: JOBSTORE_PG_DSN, valueFrom: {secretKeyRef: {name: omi-db-app, key: uri}}}
          resources: {requests: {memory: 128Mi, cpu: 50m}, limits: {memory: 512Mi, cpu: 250m}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
# PVC voor self-hosted object storage (vervangt GCS): omi-backend mount dit
# als /omi-state; public URLs via OMI_LOCAL_STORAGE_BASE_URL -> /_local/storage.
# ReadWriteMany (longhorn exporteert NFS) zodat beide backend-replica's
# dezelfde files zien.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: omi-storage-data, namespace: omi}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 20Gi}}
